name: DRIFT Showcase Gate

on:
  push:
    branches: [drift-baseline]
  pull_request:
    branches: [drift-baseline]
  workflow_dispatch:

permissions:
  contents: read

env:
  DRIFT_REPO: rad-ox/drift
  DRIFT_VERSION: '0.10.0'
  DRIFT_TAG: 'v0.10.0'

jobs:
  native-tests:
    name: Native Tests (mvn test)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Java 25 (Temurin)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Install DRIFT Free binary (SHA256 verified)
        run: |
          mkdir -p "$RUNNER_TEMP/drift-bin"
          cd "$RUNNER_TEMP/drift-bin"
          BASE="https://github.com/${DRIFT_REPO}/releases/download/${DRIFT_TAG}"
          TAR="drift-${DRIFT_VERSION}-linux-x64.tar.gz"
          curl -fsSLO "$BASE/$TAR"
          curl -fsSLO "$BASE/SHA256SUMS"
          grep "  $TAR$" SHA256SUMS | sha256sum -c -
          tar -xzf "$TAR"
          DRIFT_PATH="$(find "$RUNNER_TEMP/drift-bin" -maxdepth 3 -type f -name drift | head -n 1)"
          chmod +x "$DRIFT_PATH"
          echo "DRIFT_BIN=$DRIFT_PATH" >> "$GITHUB_ENV"

      - name: Install drift-junit bridge from pinned DRIFT tag
        run: |
          git clone --depth 1 --branch "${DRIFT_TAG}" \
            "https://github.com/${DRIFT_REPO}.git" \
            "$RUNNER_TEMP/drift-upstream"
          mvn -q -B -f "$RUNNER_TEMP/drift-upstream/bridges/jvm/drift-junit/pom.xml" install -DskipTests

      - name: Export DRIFT contract views and run mvn test
        run: |
          mkdir -p target/drift/resolved target/drift/events
          "$DRIFT_BIN" show .drift/contracts --as json --out target/drift/resolved
          DRIFT_RESOLVED="$PWD/target/drift/resolved" \
          DRIFT_EVENTS="$PWD/target/drift/events/jvm.jsonl" \
            mvn -B -q clean test -Dtest=OwnerApiDriftTest

      - name: Upload DRIFT proof events artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drift-events
          path: target/drift/events
          if-no-files-found: warn

  drift-gate:
    name: DRIFT Gate (Free v0.10.0)
    needs: native-tests
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download proof events
        uses: actions/download-artifact@v4
        with:
          name: drift-events
          path: drift-events

      - name: Install DRIFT Free binary (SHA256 verified)
        run: |
          mkdir -p "$RUNNER_TEMP/drift-bin"
          cd "$RUNNER_TEMP/drift-bin"
          BASE="https://github.com/${DRIFT_REPO}/releases/download/${DRIFT_TAG}"
          TAR="drift-${DRIFT_VERSION}-linux-x64.tar.gz"
          curl -fsSLO "$BASE/$TAR"
          curl -fsSLO "$BASE/SHA256SUMS"
          grep "  $TAR$" SHA256SUMS | sha256sum -c -
          tar -xzf "$TAR"
          DRIFT_PATH="$(find "$RUNNER_TEMP/drift-bin" -maxdepth 3 -type f -name drift | head -n 1)"
          chmod +x "$DRIFT_PATH"
          echo "DRIFT_BIN=$DRIFT_PATH" >> "$GITHUB_ENV"

      - name: Run drift gate (Free edition)
        run: |
          set +e
          DRIFT_EDITION=free "$DRIFT_BIN" gate .drift/contracts --events drift-events --explain > gate.txt 2>&1
          RC=$?
          cat gate.txt
          {
            echo "## DRIFT Gate (Free ${DRIFT_TAG})"
            echo ""
            echo '```text'
            cat gate.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $RC

  open-verifier:
    name: Open MIT Verifier (drift_verify.py)
    needs: native-tests
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Download proof events
        uses: actions/download-artifact@v4
        with:
          name: drift-events
          path: drift-events

      - name: Fetch open MIT verifier from pinned DRIFT tag
        run: |
          git clone --depth 1 --branch "${DRIFT_TAG}" \
            "https://github.com/${DRIFT_REPO}.git" \
            "$RUNNER_TEMP/drift-upstream"
          python3 "$RUNNER_TEMP/drift-upstream/verifier/drift_verify.py" --self-test

      - name: Independently verify DRIFT proofs
        run: |
          set +e
          python3 "$RUNNER_TEMP/drift-upstream/verifier/drift_verify.py" \
            .drift/contracts \
            --config .drift/config.toml \
            --events drift-events \
            --json > verifier.json 2>&1
          RC=$?
          cat verifier.json
          {
            echo "## Open MIT Verifier (\`verifier/drift_verify.py\` @ ${DRIFT_TAG})"
            echo ""
            echo '```json'
            cat verifier.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $RC
