name: DRIFT Showcase Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  DRIFT_REPO: rad-ox/drift
  DRIFT_VERSION: '0.11.0'
  DRIFT_TAG: 'v0.11.0'

jobs:
  native-tests:
    name: Native JUnit Tests (mvn test)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Java 25 (Temurin)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Install DRIFT Free v0.11.0 (SHA256 verified)
        run: |
          mkdir -p "$RUNNER_TEMP/drift-pkg"
          cd "$RUNNER_TEMP/drift-pkg"
          BASE="https://github.com/${DRIFT_REPO}/releases/download/${DRIFT_TAG}"
          TAR="drift-${DRIFT_VERSION}-linux-x64.tar.gz"
          curl -fsSLO "$BASE/$TAR"
          curl -fsSLO "$BASE/SHA256SUMS"
          sha256sum --ignore-missing -c SHA256SUMS
          tar -xzf "$TAR"
          "./drift-${DRIFT_VERSION}-linux-x64/install.sh" --no-skill --no-hooks
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run native JUnit 5 tests (no DRIFT gate)
        run: |
          DRIFT_STRICT_WHEN=1 mvn -q -B test -Dtest=OwnerApiDriftTest

  drift-gate:
    name: DRIFT v0.11.0 Gate + Independent MIT Verifier
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Java 25 (Temurin)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Setup Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install DRIFT Free v0.11.0 (SHA256 verified)
        run: |
          mkdir -p "$RUNNER_TEMP/drift-pkg"
          cd "$RUNNER_TEMP/drift-pkg"
          BASE="https://github.com/${DRIFT_REPO}/releases/download/${DRIFT_TAG}"
          TAR="drift-${DRIFT_VERSION}-linux-x64.tar.gz"
          curl -fsSLO "$BASE/$TAR"
          curl -fsSLO "$BASE/SHA256SUMS"
          sha256sum --ignore-missing -c SHA256SUMS
          tar -xzf "$TAR"
          "./drift-${DRIFT_VERSION}-linux-x64/install.sh" --no-skill --no-hooks
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "DRIFT_VERIFIER=$RUNNER_TEMP/drift-pkg/drift-${DRIFT_VERSION}-linux-x64/verifier/drift_verify.py" >> "$GITHUB_ENV"

      - name: Run drift run --gate and verify MIT parity
        run: |
          set +e
          DRIFT_EDITION=free DRIFT_STRICT_WHEN=1 \
            drift run --events target/drift-events --gate -- \
            mvn -q -B test -Dtest=OwnerApiDriftTest
          RUN_RC=$?

          DRIFT_EDITION=free drift gate .drift/contracts --events target/drift-events --json > gate.json
          GATE_RC=$?
          DRIFT_EDITION=free drift gate .drift/contracts --events target/drift-events --explain > gate.txt 2>&1

          python3 "$DRIFT_VERIFIER" --self-test
          SELFTEST_RC=$?

          python3 "$DRIFT_VERIFIER" \
            .drift/contracts \
            --config .drift/config.toml \
            --events target/drift-events \
            --compare-gate gate.json \
            --json > verifier.json
          VERIFIER_RC=$?

          python3 -c 'import json, sys; d = json.load(open("verifier.json")); sys.exit(0 if d.get("parity", {}).get("ok") is True else 1)'
          PARITY_RC=$?

          echo "=== drift gate --explain ==="
          cat gate.txt
          echo "=== drift_verify.py --compare-gate ==="
          cat verifier.json

          {
            echo "## DRIFT Gate (Free ${DRIFT_TAG})"
            echo ""
            echo '```text'
            cat gate.txt
            echo '```'
            echo ""
            echo "## Independent MIT Verifier (\`drift_verify.py --compare-gate\`)"
            echo ""
            echo '```json'
            cat verifier.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$SELFTEST_RC" -ne 0 ] || [ "$PARITY_RC" -ne 0 ]; then
            echo "Independent verifier self-test or parity check failed (selftest=$SELFTEST_RC parity=$PARITY_RC)"
            exit 1
          fi
          if [ "$RUN_RC" -ne 0 ] || [ "$GATE_RC" -ne 0 ] || [ "$VERIFIER_RC" -ne 0 ]; then
            exit 1
          fi

